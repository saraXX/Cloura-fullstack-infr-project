stages:
  - test
  - build
  - deploy

test:
  stage: test
  script:
    - python3 -m compileall app/backend
    - python3 -m compileall app/streamlit

build:
  stage: build
  script:
    - docker compose build

deploy:
  stage: deploy
  script:
    - docker compose up -d
    - sleep 10
    - curl --fail http://localhost:8000/health
