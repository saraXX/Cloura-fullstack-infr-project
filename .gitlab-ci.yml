stages:
  - test
  - build
  - security
  - deploy
  - verify

test-backend:
  stage: test
  script:
    - echo "Checking backend Python files..."
    - python3 -m compileall app/backend
    - echo "Backend check passed."

test-streamlit:
  stage: test
  script:
    - echo "Checking Streamlit Python files..."
    - python3 -m compileall app/streamlit
    - echo "Streamlit check passed."


build:
  stage: build
  script:
    - echo "Validating Docker Compose configuration..."
    - docker compose config --quiet
    - echo "Building application containers..."
    - docker compose build
    - echo "Build completed."

security-scan:
  stage: security
  script:
    - echo "Scanning Docker images with Trivy..."
    - |
      docker compose config --images | sort -u | while read -r image
      do
        echo "Scanning $image..."

        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest \
          image --image-src docker \
          --scanners vuln \
          --severity HIGH,CRITICAL \
          --exit-code 0 \
          "$image" || exit 1
      done
    - echo "Security scanning completed."  

deploy:
  stage: deploy
  resource_group: app-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Deploying CloudAura application..."
    - docker compose up -d --remove-orphans
    - echo "Deployment completed."
    - docker compose ps

app-health-check:
  stage: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Running application health check..."
    - ./scripts/app-health-check.sh
