
services:
  db:
    image: postgres:16
    container_name: cloura-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./app/backend
    container_name: cloura-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./app/streamlit
    container_name: cloura-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
